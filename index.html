<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>수진T.의 중학교 과학 LAB</title>
<!-- 최종안 · 고운돋움(A안 서체) + 세이지/버터/파우더블루(C안 색상) -->
<meta name="description" content="중학교 과학 수업용 가상 실험실 모음">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧪</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
  /* ============================================================
     색상 (라일락 계열) — 여기 값만 바꾸면 전체 색이 바뀝니다
     ============================================================ */
  :root{
    --bg:#fbf8ff;          /* 배경 (아주 연한 라일락) */
    --ink:#35294a;         /* 기본 글자 */
    --ink-soft:#716488;    /* 보조 글자 */
    --card:#ffffff;
    --line:#ece4f8;
    --p1:#dccdf5;          /* 연라일락 */
    --p2:#bba6e6;          /* 라일락 */
    --p3:#8f74cf;          /* 버튼 */
    --p3-dark:#6e55ad;     /* 버튼 그림자 */
    --g1:#cfe3c8; --g1-dark:#5b8a4e; --g1-light:#f1f7ee;   /* 1학년 */
    --g2:#f7e2b5; --g2-dark:#8a5f1a; --g2-light:#fdf7ea;   /* 2학년 */
    --g3:#cbd6f2; --g3-dark:#5566b0; --g3-light:#eef1fb;   /* 3학년 */
    --teacher:#f59e0b;
    /* 학년 화면 강조색 (스크립트가 바꿈) */
    --gc:var(--p2); --gcd:var(--p3); --gcl:#f4effd;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{min-height:100%}
  body{
    font-family:'Gowun Dodum',system-ui,sans-serif;
    color:var(--ink);
    background:linear-gradient(180deg,#f3edff 0%,var(--bg) 320px);
    background-color:var(--bg);
    line-height:1.55;
    word-break:keep-all;
    -webkit-font-smoothing:antialiased;
  }
  .jua{font-family:'Jua',sans-serif;font-weight:400}
  .wrap{max-width:1040px;margin:0 auto;padding:28px 16px 56px}

  /* ---------- 교사 모드 배너 ---------- */
  .teacher-bar{
    display:none;background:#fff7e6;border:2px dashed var(--teacher);
    color:#8a5300;border-radius:14px;padding:10px 14px;margin-bottom:18px;
    font-weight:600;font-size:14px;align-items:center;gap:8px;flex-wrap:wrap
  }
  body.teacher .teacher-bar{display:flex}

  /* ---------- 헤더 ---------- */
  header{text-align:center;margin:12px 0 34px}
  .logo{
    width:84px;height:84px;margin:0 auto 14px;border-radius:26px;
    background:linear-gradient(145deg,var(--p1),var(--p3));
    display:grid;place-items:center;
    box-shadow:0 6px 0 var(--p3-dark),0 14px 28px rgba(143,116,207,.22);
    animation:float 3.2s ease-in-out infinite;
  }
  @keyframes float{50%{transform:translateY(-6px)}}
  .badge{
    display:inline-block;background:#fff;border:2px solid var(--line);
    color:var(--p3);border-radius:999px;padding:4px 14px;font-size:14px;margin-bottom:10px
  }
  h1{font-size:clamp(30px,6.5vw,52px);line-height:1.15;letter-spacing:-.5px}
  h1 .accent{color:var(--p3)}
  .sub{color:var(--ink-soft);margin-top:10px;font-size:clamp(15px,2.6vw,17px)}

  /* ---------- 학년 카드 ---------- */
  .grades{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
  @media (max-width:760px){.grades{grid-template-columns:1fr}}
  .grade{
    --c:var(--g1);--cd:var(--g1-dark);--cl:var(--g1-light);
    position:relative;overflow:hidden;cursor:pointer;text-align:left;
    border:3px solid var(--c);border-radius:26px;background:var(--card);
    padding:22px 22px 20px;font:inherit;color:inherit;
    box-shadow:0 7px 0 var(--c);transition:transform .12s, box-shadow .12s;
  }
  .grade:hover{transform:translateY(-3px);box-shadow:0 10px 0 var(--c)}
  .grade:active{transform:translateY(5px);box-shadow:0 2px 0 var(--c)}
  .grade:focus-visible{outline:4px solid var(--p2);outline-offset:3px}
  .grade.g2{--c:var(--g2);--cd:var(--g2-dark);--cl:var(--g2-light)}
  .grade.g3{--c:var(--g3);--cd:var(--g3-dark);--cl:var(--g3-light)}
  .grade .blob{
    position:absolute;right:-30px;top:-30px;width:130px;height:130px;border-radius:50%;
    background:var(--cl);opacity:1
  }
  .grade .num{
    position:relative;width:64px;height:64px;border-radius:20px;background:var(--c);
    display:grid;place-items:center;font-size:34px;color:var(--cd);margin-bottom:14px
  }
  .grade h2{font-size:30px;position:relative}
  .grade p{color:var(--ink-soft);font-size:15px;margin-top:2px;position:relative}
  .grade .meta{
    margin-top:16px;display:flex;justify-content:space-between;align-items:center;position:relative
  }
  .pill{background:var(--cl,var(--bg));border:2px solid var(--c,var(--line));border-radius:999px;padding:3px 12px;font-size:13px;font-weight:700;color:var(--cd,var(--p3))}
  .arrow{width:38px;height:38px;border-radius:50%;background:var(--cd);color:#fff;display:grid;place-items:center;font-size:20px}

  /* ---------- 하위(앱) 화면 ---------- */
  .view{display:none}
  .view.on{display:block;animation:pop .28s ease}
  @keyframes pop{from{opacity:0;transform:translateY(10px)}}
  .topline{display:flex;align-items:center;gap:12px;margin-bottom:22px;flex-wrap:wrap}
  .back{
    font:inherit;font-family:'Jua';font-size:18px;cursor:pointer;
    background:#fff;border:3px solid var(--p2);color:var(--p3);border-radius:16px;
    padding:8px 16px;box-shadow:0 4px 0 var(--p2)
  }
  .back:active{transform:translateY(3px);box-shadow:0 1px 0 var(--p2)}
  .topline h2{font-size:clamp(26px,5vw,36px)}
  .apps{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:18px}
  .app{
    background:var(--card);border:3px solid var(--line);border-radius:24px;padding:20px;
    display:flex;flex-direction:column;gap:10px;box-shadow:0 6px 0 var(--line);border-top:8px solid var(--gc)
  }
  .app .head{display:flex;gap:14px;align-items:center}
  .icon{
    flex:none;width:60px;height:60px;border-radius:18px;font-size:32px;
    display:grid;place-items:center;background:var(--gcl);border:2px solid var(--gc)
  }
  .unit{display:inline-block;font-size:12.5px;font-weight:700;color:var(--gcd);background:var(--gcl);border-radius:8px;padding:2px 8px}
  .app h3{font-size:23px;line-height:1.25;margin-top:3px}
  .app .desc{color:var(--ink-soft);font-size:15px;flex:1}
  .start{
    display:block;text-align:center;text-decoration:none;font-family:'Jua';font-size:21px;
    background:var(--gcd);color:#fff;border-radius:16px;padding:11px;
    box-shadow:0 5px 0 color-mix(in srgb,var(--gcd) 70%,#000);transition:transform .1s, box-shadow .1s
  }
  .start:hover{filter:brightness(1.08)}
  .start:active{transform:translateY(4px);box-shadow:0 1px 0 color-mix(in srgb,var(--gcd) 70%,#000)}
  .t-tools{display:none;gap:8px}
  body.teacher .t-tools{display:flex}
  .t-btn{
    flex:1;font:inherit;font-size:13.5px;font-weight:700;cursor:pointer;text-align:center;text-decoration:none;
    border:2px solid var(--teacher);background:#fff7e6;color:#8a5300;border-radius:12px;padding:7px
  }
  .soon{
    border:3px dashed var(--gc);border-radius:24px;padding:34px 20px;text-align:center;color:var(--ink-soft);
    background:rgba(255,255,255,.6)
  }
  .soon .big{font-size:44px}
  .soon b{display:block;font-family:'Jua';font-weight:400;font-size:22px;color:var(--gcd);margin:6px 0 2px}

  footer{text-align:center;color:var(--ink-soft);font-size:13px;margin-top:44px}
  .toast{
    position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(30px);opacity:0;
    background:var(--ink);color:#fff;padding:10px 18px;border-radius:12px;font-size:14px;transition:.25s;pointer-events:none
  }
  .toast.on{opacity:1;transform:translateX(-50%)}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">

  <div class="teacher-bar">👩‍🏫 교사 모드입니다 — 각 앱 카드에 교사용 링크가 표시됩니다. 이 주소는 학생에게 공유하지 마세요.</div>

  <header>
    <div class="logo">
      <svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M9 3h6"/><path d="M10 3v6L4.5 18.5A1.7 1.7 0 0 0 6 21h12a1.7 1.7 0 0 0 1.5-2.5L14 9V3"/><path d="M7 15h10"/>
      </svg>
    </div>
    <span class="badge jua">🔬 가상 실험실 모음</span>
    <h1 class="jua">수진T.의<br><span class="accent">중학교 과학 LAB</span></h1>
    <p class="sub">학년을 고르고, 실험을 시작해 보세요!</p>
  </header>

  <!-- 첫 화면: 학년 카드 -->
  <section id="home" class="view on">
    <div class="grades" id="grades"></div>
  </section>

  <!-- 하위 화면: 앱 카드 -->
  <section id="grade-view" class="view">
    <div class="topline">
      <button class="back" onclick="location.hash=''">← 학년 선택</button>
      <h2 class="jua" id="gv-title"></h2>
    </div>
    <div class="apps" id="apps"></div>
  </section>

  <footer>© 수진T. · 중학교 과학 수업용</footer>
</div>
<div class="toast" id="toast"></div>

<script>
/* ============================================================
   ✏️ 앱 목록 — 새 웹앱을 만들면 해당 학년의 apps 배열에 항목을 추가하세요.
   { icon, name, unit, desc, url }
   ============================================================ */
const GRADES = [
  { id:'g1', label:'1학년', emoji:'🌍', intro:'과학의 첫걸음을 내딛어요', apps:[] },
  { id:'g2', label:'2학년', emoji:'⚡', intro:'원리를 실험으로 확인해요', apps:[] },
  { id:'g3', label:'3학년', emoji:'🧬', intro:'생명과 유전의 비밀을 풀어요', apps:[
      { icon:'🌱',
        name:'멘델 유전 실험실',
        unit:'생식과 유전 · 멘델의 유전 원리',
        desc:'완두를 직접 교배하며 우열의 원리, 분리의 법칙, 독립의 법칙을 발견해요.',
        url:'https://soojin-t.github.io/mendel-lab/' }
  ]}
];

const isTeacher = new URLSearchParams(location.search).has('teacher');
if (isTeacher) document.body.classList.add('teacher');

const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const teacherUrl = u => u + (u.includes('?') ? '&' : '?') + 'teacher';

/* 학년 카드 그리기 */
document.getElementById('grades').innerHTML = GRADES.map((g,i) => `
  <button class="grade ${g.id}" onclick="location.hash='${g.id}'" aria-label="${g.label} 실험 보기">
    <span class="blob"></span>
    <div class="num jua">${i+1}</div>
    <h2 class="jua">${g.emoji} ${g.label}</h2>
    <p>${g.intro}</p>
    <div class="meta">
      <span class="pill">${g.apps.length ? '실험 ' + g.apps.length + '개' : '준비 중'}</span>
      <span class="arrow">→</span>
    </div>
  </button>`).join('');

/* 앱 카드 그리기 */
function renderGrade(g){
  document.getElementById('gv-title').textContent = `${g.emoji} ${g.label} 실험실`;
  const box = document.getElementById('apps');
  if (!g.apps.length){
    box.innerHTML = `<div class="soon"><div class="big">🛠️</div><b>실험을 준비하고 있어요</b>조금만 기다려 주세요!</div>`;
    return;
  }
  box.innerHTML = g.apps.map(a => `
    <article class="app">
      <div class="head">
        <div class="icon">${a.icon}</div>
        <div><span class="unit">${esc(a.unit)}</span><h3 class="jua">${esc(a.name)}</h3></div>
      </div>
      <p class="desc">${esc(a.desc)}</p>
      <a class="start" href="${esc(a.url)}">시작 ▶</a>
      <div class="t-tools">
        <a class="t-btn" href="${esc(teacherUrl(a.url))}">👩‍🏫 교사용 열기</a>
        <button class="t-btn" onclick="copyLink('${esc(a.url)}')">🔗 학생 링크 복사</button>
      </div>
    </article>`).join('');
}

/* 주소(#g1 등)에 따라 화면 전환 — 브라우저 뒤로가기도 동작 */
function route(){
  const g = GRADES.find(x => x.id === location.hash.slice(1));
  document.getElementById('home').classList.toggle('on', !g);
  document.getElementById('grade-view').classList.toggle('on', !!g);
  const gv=document.getElementById('grade-view').style;
  if (g){ ['','-dark','-light'].forEach((k,i)=>gv.setProperty(['--gc','--gcd','--gcl'][i],`var(--${g.id}${k})`)); renderGrade(g); }
  window.scrollTo(0,0);
}
window.addEventListener('hashchange', route);
route();

function copyLink(u){
  const done = () => toast('학생용 링크를 복사했어요');
  if (navigator.clipboard) navigator.clipboard.writeText(u).then(done, () => prompt('복사하세요', u));
  else prompt('복사하세요', u);
}
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('on');
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('on'), 1800);
}
</script>
</body>
</html>
